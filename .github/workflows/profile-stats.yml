name: Update profile stats

on:
  schedule:
    - cron: '23 9 * * *' # 06:23 in Brasilia (UTC-3)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate SVG cards using GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile.py
      - name: Commit updated cards
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-stats.svg assets/top-languages.svg assets/github-streak.svg assets/contribution-activity.svg
          if git diff --cached --quiet; then
            echo 'Cards are already up to date.'
            exit 0
          fi
          git commit -m 'chore: update profile stats'
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
